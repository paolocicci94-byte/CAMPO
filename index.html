<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#236a37"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Campo"><title>Campo – settori e accensioni</title>
<style>
:root{--bg:#F4F6F2;--card:#fff;--ink:#1d2a22;--mute:#64736a;--line:#dde4da;--acc:#2f6b3f;--warn:#b4501a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d261f;--ink:#e6ede7;--mute:#9aa9a0;--line:#2d3a31;--acc:#6fbf86;--warn:#e7894f}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d261f;--ink:#e6ede7;--mute:#9aa9a0;--line:#2d3a31;--acc:#6fbf86;--warn:#e7894f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:16px 14px 100px}
h2{font-size:1.1rem;margin:0}h3{margin:18px 0 6px;text-transform:capitalize}
.z{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:10px 12px;margin-bottom:14px}
.z header,.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mute{color:var(--mute);font-size:.9rem}.warn{color:var(--warn);font-weight:600;font-size:.9rem}.on{color:var(--acc);font-weight:600;font-size:.9rem}.ok{color:var(--acc)}
.b{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;min-height:40px}
.b.stop{background:var(--warn)}.lk{background:none;border:0;color:var(--mute);font:inherit;font-size:.85rem;padding:6px}
.pk{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}.pk .b{background:var(--line);color:var(--ink)}
.add{display:flex;gap:6px;margin-top:8px}.add input:not([type=color]){flex:1;min-width:0}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=color]{padding:2px;width:44px}input[type=number]{width:64px}textarea{width:100%}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.g i{font-style:normal;color:var(--mute);font-size:.8rem}
.d{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;min-height:46px;padding:4px 0}.d.sel{outline:2px solid var(--acc)}
.d em{display:flex;gap:2px;justify-content:center;height:6px;margin-top:2px}.d u{width:6px;height:6px;border-radius:50%}
.row{display:flex;gap:8px;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;padding:14px 4px}nav button.cur{color:var(--acc);font-weight:700}
.pk.col{flex-direction:column;align-items:stretch}.pk .row .b{background:var(--acc);color:var(--bg)}
.pr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pr input[data-f=n]{flex:2 1 130px;min-width:0}.pr input[type=number]{width:80px}.pr input[data-f=o]{width:90px}
select,input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}.seg{margin:0 0 10px}.seg .b{flex:1}.b.off{background:var(--line);color:var(--ink)}
nav button{font-size:.85rem;padding:14px 2px}.b.sm{min-height:32px;padding:5px 10px}
:root{--mute:#4a5a50;--acc:#236a37;--warn:#a8420f}
body{font-size:18px}main{padding-bottom:110px}
.b{min-height:50px;padding:12px 20px;font-size:1.05rem;border-radius:10px}.b.sm{min-height:40px}.s .b{min-width:112px}
.lk{font-size:1rem;padding:12px 8px}input,select,textarea{font-size:1.05rem;padding:12px}
.mute,.warn,.on{font-size:1rem}nav button{font-size:.95rem;padding:16px 2px}button{touch-action:manipulation}
#tt{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;z-index:9}#tt[hidden]{display:none}#tt .lk{color:var(--bg);font-weight:700;text-decoration:underline}
</style></head><body>
<main id="v"></main>
<div id="tt" hidden></div>
<nav><button data-tab="oggi">Settori</button><button data-tab="cal">Calendario</button><button data-tab="sto">Storico</button><button data-tab="mag">Magazzino</button></nav>
<script>
const TYPES={acqua:'Acqua',trattamento:'Trattamento',concimazione:'Concimazione'};
const COL=['#2f8f4e','#d08a1e','#2b7bbf','#b5485d','#7b5ab5','#1f9c9c'];
let S={zones:[],logs:[],alertDays:7,stock:[]};
try{const r=localStorage.getItem('campo');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('campo',JSON.stringify(S))}catch(e){}};
let tab='oggi',sel=new Date(),cal=new Date(),pick=null,conf=null,io='',msg='',view='m',undo=null,tm=null,ms=null,ml=null,mmsg='',dmsg='',hs='',hf='tutti',dr=null,ed=null,emsg='';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dur=ms=>{const m=Math.floor(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
const open=id=>S.logs.find(l=>l.s===id&&!l.e);
const last=id=>S.logs.filter(l=>l.s===id).sort((a,b)=>b.b-a.b)[0];
const blank=()=>({n:'',q:'',u:'L',o:''});
const ul=x=>x.u==='Altro'?(x.o||'altro'):x.u;
const prodTxt=l=>(l.p||[]).map(x=>esc(x.n)+(x.q?' '+esc(x.q)+' '+esc(ul(x)):'')).join(', ');
const clean=p=>p.filter(x=>x.n.trim()).map(x=>({n:x.n.trim(),q:x.q,u:x.u,o:(x.o||'').trim()}));
const loc=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const hm=ms=>new Date(ms).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const newMs=()=>({id:'',n:'',q:'',u:'Kg',o:'',m:'',k:'',u2:'Kg'});ms=newMs();
const fmt=n=>+Math.max(0,+n).toFixed(2);
const fnd=x=>S.stock.find(s=>s.n.trim().toLowerCase()===x.n.trim().toLowerCase());
const su=(s,x)=>s.u===x.u&&(x.u!=='Altro'||(s.o||'').toLowerCase()===(x.o||'').toLowerCase());
function cv(s,x){const q=+x.q;if(su(s,x))return q;if(s.k&&s.u2&&x.u===s.u2)return q/s.k;return null}
function adj(p,sg){(p||[]).forEach(x=>{const s=fnd(x);if(!s||!x.q)return;const v=cv(s,x);if(v!==null)s.q=+((+s.q)+sg*v).toFixed(4)})}
function chk(p){for(const x of p){const s=fnd(x);if(s&&x.q&&cv(s,x)===null)return 'Per '+s.n+' nel magazzino puoi usare '+ul(s)+(s.k?' oppure '+s.u2:'')+'.'}return ''}
const dd=ms=>new Date(ms).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
function toast(m,u){undo=u;const t=$('#tt');t.innerHTML=m+' <button class="lk" data-a="undo">Annulla</button>';t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>{t.hidden=true;undo=null},8000)}
function start(i,t,p){const zz=S.zones.find(z=>z.sectors.some(s=>s.id===i)),cl=[];zz.sectors.forEach(s=>{const o=open(s.id);if(o){o.e=Date.now();cl.push(o)}});const l={id:uid(),s:i,t,b:Date.now(),e:null,p};S.logs.push(l);toast('Settore acceso.',{k:'start',id:l.id,cl})}
const prodEd=(p,c)=>p.map((x,k)=>`<div class="pr"><input list="stk" data-c="${c}" data-k="${k}" data-f="n" placeholder="Prodotto" value="${esc(x.n)}"><input data-c="${c}" data-k="${k}" data-f="q" type="number" step="any" min="0" placeholder="Quantità" value="${esc(x.q)}"><select data-c="${c}" data-k="${k}" data-f="u">${['L','Kg','Sacchi','Altro'].map(u=>`<option${u===x.u?' selected':''}>${u}</option>`).join('')}</select>${x.u==='Altro'?`<input data-c="${c}" data-k="${k}" data-f="o" placeholder="Unità" value="${esc(x.o||'')}">`:''}${p.length>1?`<button class="lk" data-a="delp" data-c="${c}" data-k="${k}">×</button>`:''}</div>`).join('')+`<datalist id="stk">${S.stock.map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist><button class="lk" data-a="addp" data-c="${c}">+ Aggiungi prodotto</button>`;
function status(id){const o=open(id);
if(o)return `<span class="on">Acceso, ${TYPES[o.t].toLowerCase()}, da <b data-b="${o.b}">${dur(Date.now()-o.b)}</b></span>${o.p&&o.p.length?`<br><span class="mute">${prodTxt(o)}</span>`:''}`;
const l=last(id);if(!l)return '<span class="mute">Mai acceso</span>';
const d=Math.floor((Date.now()-(l.e||l.b))/864e5);
if(d>=S.alertDays)return `<span class="warn">Non acceso da ${d} giorni</span>`;
return `<span class="mute">Ultima volta ${d==0?'oggi':d==1?'ieri':d+' giorni fa'}, ${TYPES[l.t].toLowerCase()}</span>`}
function oggi(){let h='';
for(const z of S.zones){h+=`<section class="z" style="--c:${z.color}"><header><h2>${esc(z.name)}</h2><button class="lk" data-a="delz" data-i="${z.id}">${conf==='delz'+z.id?'Conferma eliminazione':'Elimina zona'}</button></header>`;
for(const s of z.sectors){const o=open(s.id);
h+=`<div class="s"><div><b>${esc(s.name)}</b> <button class="lk" data-a="dels" data-i="${s.id}">${conf==='dels'+s.id?'Conferma':'×'}</button><br>${status(s.id)}</div>`+(o?`<button class="b stop" data-a="stop" data-i="${s.id}">Spegni</button>`:`<button class="b" data-a="pick" data-i="${s.id}">Accendi</button>`)+`</div>`;
if(pick===s.id)h+=(dr&&dr.s===s.id?`<div class="pk col"><b>${TYPES[dr.t]}</b>${prodEd(dr.p,'d')}${dmsg?`<p class="warn">${dmsg}</p>`:''}<div class="row"><button class="b" data-a="go">Avvia</button><button class="lk" data-a="canc">Annulla</button></div></div>`:`<div class="pk">`+Object.entries(TYPES).map(([k,v])=>`<button class="b" data-a="${k==='acqua'?'on':'dr'}" data-i="${s.id}" data-t="${k}">${v}</button>`).join('')+`</div>`)}
h+=`<form class="add" data-a="adds" data-i="${z.id}"><input placeholder="Nuovo settore" required><button class="b">Aggiungi</button></form></section>`}
h+=`<form class="z add" data-a="addz"><input placeholder="Nuova zona" required><input type="color" value="${COL[S.zones.length%COL.length]}"><button class="b">Crea zona</button></form>`;
return (S.zones.length?'':'<p class="mute">Crea la prima zona, poi aggiungi i suoi settori.</p>')+h+'<p><button class="lk" data-tab="imp">Impostazioni e backup</button></p>'}
function logCard(l,zc,sd){const c=zc[l.s]||['#999','?','?'];
if(ed&&ed.id===l.id)return `<div class="z" style="--c:${c[0]}"><b>${esc(c[1])}, ${esc(c[2])}</b><label class="fl">Tipo <select data-f="t">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${k===ed.t?' selected':''}>${v}</option>`).join('')}</select></label><label class="fl">Inizio <input type="datetime-local" data-f="b" value="${ed.b}"></label>${ed.run?'<p class="mute">Ancora acceso: la fine resta vuota finché non lo spegni.</p>':`<label class="fl">Fine <input type="datetime-local" data-f="e" value="${ed.e}"></label>`}${ed.t!=='acqua'?prodEd(ed.p,'e'):''}${emsg?`<p class="warn">${emsg}</p>`:''}<div class="row"><button class="b" data-a="sv">Salva</button><button class="lk" data-a="canc">Annulla</button><button class="lk" data-a="rm" data-i="${l.id}">${conf==='rm'+l.id?'Conferma eliminazione':'Elimina'}</button></div></div>`;
return `<div class="s" style="border-left:4px solid ${c[0]};padding-left:10px"><div><b>${esc(c[1])}, ${esc(c[2])}</b><br><span class="mute">${sd?dd(l.b)+', ':''}${TYPES[l.t]}, dalle ${hm(l.b)}, ${l.e?'durata '+dur(l.e-l.b):'ancora acceso'}</span>${l.p&&l.p.length?`<br><span class="mute">${prodTxt(l)}</span>`:''}</div><button class="lk" data-a="edit" data-i="${l.id}">Modifica</button></div>`}
function calendario(){const zc={};S.zones.forEach(z=>z.sectors.forEach(s=>zc[s.id]=[z.color,z.name,s.name]));
const key=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
const by={};S.logs.forEach(l=>(by[key(new Date(l.b))]??=[]).push(l));
const dl=d=>(by[key(d)]||[]).sort((a,b)=>a.b-b.b);
const ttl=d=>d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
const cards=L=>L.length?L.map(l=>logCard(l,zc)).join(''):'<p class="mute">Nessuna accensione in questo giorno.</p>';
let h=`<div class="row seg">`+[['g','Giorno'],['s','Settimana'],['m','Mese']].map(([k,v])=>`<button class="b${view===k?'':' off'}" data-a="vw" data-i="${k}">${v}</button>`).join('')+`</div>`;
if(view==='m'){const y=cal.getFullYear(),m=cal.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
h+=`<div class="mh"><button class="lk" data-a="mon" data-i="-1">‹ Prima</button><h2>${cal.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h2><button class="lk" data-a="mon" data-i="1">Dopo ›</button></div><div class="g">`+['L','M','M','G','V','S','D'].map(d=>`<i>${d}</i>`).join('');
for(let i=0;i<first;i++)h+='<span></span>';
for(let d=1;d<=n;d++){const dt=new Date(y,m,d),cs=[...new Set(dl(dt).map(l=>zc[l.s]&&zc[l.s][0]).filter(Boolean))];
h+=`<button class="d${key(dt)===key(sel)?' sel':''}" data-a="day" data-i="${dt.getTime()}">${d}<em>${cs.map(c=>`<u style="background:${c}"></u>`).join('')}</em></button>`}
h+=`</div><h3>${ttl(sel)}</h3>`+cards(dl(sel))}
else{const w=view==='s',st=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()-(w?(sel.getDay()+6)%7:0)),days=[...Array(w?7:1)].map((_,i)=>new Date(st.getFullYear(),st.getMonth(),st.getDate()+i)),step=w?7:1;
h+=`<div class="mh"><button class="lk" data-a="dy" data-i="-${step}">‹ Prima</button><h2>${w?'Settimana dal '+days[0].toLocaleDateString('it-IT',{day:'numeric',month:'long'}):ttl(sel)}</h2><button class="lk" data-a="dy" data-i="${step}">Dopo ›</button></div>`;
days.forEach(d=>{if(w)h+=`<h3>${ttl(d)}</h3>`;h+=w&&!dl(d).length?'<p class="mute">Nessuna accensione.</p>':cards(dl(d))})}
return h}
function storico(){const zc={};S.zones.forEach(z=>z.sectors.forEach(s=>zc[s.id]=[z.color,z.name,s.name]));
if(!zc[hs])hs=Object.keys(zc)[0]||'';
if(!hs)return '<p class="mute">Crea prima una zona con almeno un settore.</p>';
const A=S.logs.filter(l=>l.s===hs).sort((a,b)=>b.b-a.b),L=A.filter(l=>hf==='tutti'||l.t===hf);
const vt=n=>n+(n==1?' volta':' volte');
let h=`<label class="fl">Settore <select id="hs">${S.zones.map(z=>`<optgroup label="${esc(z.name)}">${z.sectors.map(s=>`<option value="${s.id}"${s.id===hs?' selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}</select></label><div class="row seg">`+[['tutti','Tutti'],['trattamento','Trattamenti'],['concimazione','Concimazioni'],['acqua','Acqua']].map(([k,v])=>`<button class="b${hf===k?'':' off'}" data-a="hf" data-i="${k}">${v}</button>`).join('')+`</div>`;
const P={};L.filter(l=>l.t!=='acqua').forEach(l=>(l.p||[]).forEach(x=>{const k=l.t+'|'+x.n.toLowerCase(),r=P[k]??={n:x.n,t:l.t,c:0,last:0,q:{}};r.c++;r.last=Math.max(r.last,l.b);if(x.q){const u=ul(x);r.q[u]=(r.q[u]||0)+ +x.q}}));
h+=`<div class="z"><b>Riepilogo</b>`+Object.keys(TYPES).filter(t=>hf==='tutti'||hf===t).map(t=>{const T=L.filter(l=>l.t===t),l0=T[0];return `<br><span class="mute">${TYPES[t]}: ${T.length?vt(T.length)+', ultima il '+dd(l0.b):'mai'}</span>`}).join('');
const R=Object.values(P).sort((a,b)=>b.c-a.c);
if(R.length)h+=`<h3>Prodotti usati</h3>`+R.map(r=>`<div class="s"><div><b>${esc(r.n)}</b> <span class="mute">(${TYPES[r.t].toLowerCase()})</span><br><span class="mute">${vt(r.c)}, ultima il ${dd(r.last)}${Object.keys(r.q).length?', in tutto '+Object.entries(r.q).map(([u,v])=>+v.toFixed(2)+' '+esc(u)).join(' + '):''}</span></div></div>`).join('');
h+=`</div><h3>Tutte le accensioni (dalla più recente)</h3>`+(L.length?L.map(l=>logCard(l,zc,1)).join(''):'<p class="mute">Nessuna accensione registrata.</p>');
return h}
function magaz(){const U=['L','Kg','Sacchi','Altro'];
let h=`<div class="z"><b>${ms.id?'Modifica prodotto':'Nuovo prodotto'}</b><div class="pr"><input data-c="m" data-f="n" placeholder="Nome (es. 20-20-20)" value="${esc(ms.n)}"></div><div class="pr"><input data-c="m" data-f="q" type="number" step="any" min="0" placeholder="Quantità in casa" value="${esc(ms.q)}"><select data-c="m" data-f="u">${U.map(u=>`<option${u===ms.u?' selected':''}>${u}</option>`).join('')}</select>${ms.u==='Altro'?`<input data-c="m" data-f="o" placeholder="Unità" value="${esc(ms.o||'')}">`:''}</div><label class="fl">1 ${esc(ul(ms))} corrisponde a (facoltativo) <span class="pr"><input data-c="m" data-f="k" type="number" step="any" min="0" placeholder="es. 25" value="${esc(ms.k)}"><select data-c="m" data-f="u2">${['Kg','L'].map(u=>`<option${u===ms.u2?' selected':''}>${u}</option>`).join('')}</select></span></label><label class="fl">Avvisa sotto (in ${esc(ul(ms))}) <input data-c="m" data-f="m" type="number" step="any" min="0" value="${esc(ms.m)}"></label>${mmsg?`<p class="warn">${mmsg}</p>`:''}<div class="row"><button class="b" data-a="msv">${ms.id?'Salva':'Aggiungi'}</button>${ms.id?`<button class="lk" data-a="mcanc">Annulla</button><button class="lk" data-a="mdel">${conf==='mdel'?'Conferma eliminazione':'Elimina'}</button>`:''}</div></div>`;
const low=s=>+s.q<=0||(s.m!==''&&s.m!=null&&+s.q<=+s.m);
const L=[...S.stock].sort((a,b)=>low(b)-low(a)||a.n.localeCompare(b.n));
h+=L.length?L.map(s=>`<div class="s"><div><b>${esc(s.n)}</b><br><span class="${low(s)?'warn':'mute'}">${fmt(s.q)} ${esc(ul(s))}${s.k?' ('+fmt(s.q*s.k)+' '+esc(s.u2)+')':''}${+s.q<=0?', finito':low(s)?', sta finendo':''}</span></div><div class="row"><button class="lk" data-a="mload" data-i="${s.id}">+ Carico</button><button class="lk" data-a="medit" data-i="${s.id}">Modifica</button></div></div>${ml===s.id?`<div class="pr"><input id="ma" type="number" step="any" min="0" placeholder="Quantità arrivata">${s.k?`<select id="mu2"><option>${esc(ul(s))}</option><option value="${esc(s.u2)}">${esc(s.u2)}</option></select>`:''}<button class="b sm" data-a="madd" data-i="${s.id}">Aggiungi</button><button class="lk" data-a="mcanc">Annulla</button></div>`:''}`).join(''):'<p class="mute">Il magazzino è vuoto: aggiungi i prodotti che hai in casa. Quando registri un trattamento o una concimazione con uno di questi prodotti, la quantità si scala da sola.</p>';
return h}
function impost(){return `<button class="lk" data-tab="oggi">‹ Indietro</button><h2>Avviso</h2><p><label>Avvisa se un settore non viene acceso da <input id="ad" type="number" min="1" value="${S.alertDays}"> giorni</label></p><h2>Backup dei dati</h2><p class="mute">Premi Crea backup, copia il testo e conservalo (per esempio nelle note). Per ripristinare, incollalo qui e premi Importa.</p><textarea id="io" rows="5">${esc(io)}</textarea><div class="row"><button class="b" data-a="exp">Crea backup</button><button class="b" data-a="imp">Importa</button></div>${msg?`<p class="ok">${msg}</p>`:''}`}
function draw(){$('#v').innerHTML=tab==='oggi'?oggi():tab==='cal'?calendario():tab==='sto'?storico():tab==='mag'?magaz():impost();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('cur',b.dataset.tab===tab))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-tab]');if(!b||b.tagName==='FORM')return;
if(b.dataset.tab){tab=b.dataset.tab;msg='';ed=null;draw();return}
const a=b.dataset.a,i=b.dataset.i;
if(a==='pick'){pick=pick===i?null:i;dr=null}
else if(a==='on'){start(i,b.dataset.t,[]);pick=null;save()}
else if(a==='dr'){dmsg='';dr={s:i,t:b.dataset.t,p:[blank()]}}
else if(a==='go'){const p=clean(dr.p),er=chk(p);if(er)dmsg=er;else{start(dr.s,dr.t,p);adj(p,-1);dr=null;pick=null;dmsg='';save()}}
else if(a==='canc'){dr=null;ed=null;emsg='';conf=null}
else if(a==='addp'){(b.dataset.c==='d'?dr:ed).p.push(blank())}
else if(a==='delp'){(b.dataset.c==='d'?dr:ed).p.splice(+b.dataset.k,1)}
else if(a==='vw'){view=i;cal=new Date(sel.getFullYear(),sel.getMonth(),1)}
else if(a==='dy')sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+ +i);
else if(a==='edit'){const l=S.logs.find(x=>x.id===i);ed={id:i,t:l.t,b:loc(l.b),e:l.e?loc(l.e):'',run:!l.e,p:(l.p||[]).map(x=>({...x}))};if(!ed.p.length)ed.p.push(blank());emsg=''}
else if(a==='rm'){const k='rm'+i;if(conf!==k)conf=k;else{conf=null;const l0=S.logs.find(l=>l.id===i);if(l0)adj(l0.p,1);S.logs=S.logs.filter(l=>l.id!==i);ed=null;save()}}
else if(a==='sv'){const l=S.logs.find(x=>x.id===ed.id),nb=new Date(ed.b).getTime(),ne=ed.run?null:new Date(ed.e).getTime();
if(!nb||(!ed.run&&(!ne||ne<nb)))emsg='Controlla gli orari: la fine deve venire dopo l’inizio.';
else{const np=ed.t==='acqua'?[]:clean(ed.p),er=chk(np);if(er)emsg=er;else{adj(l.p,1);l.t=ed.t;l.b=nb;l.e=ne;l.p=np;adj(np,-1);ed=null;emsg='';save()}}}
else if(a==='hf')hf=i;
else if(a==='mcanc'){ms=newMs();ml=null;mmsg='';conf=null}
else if(a==='medit'){ms={...newMs(),...S.stock.find(x=>x.id===i)};ml=null;mmsg=''}
else if(a==='mload'){ml=i;ms=newMs()}
else if(a==='madd'){const s=S.stock.find(x=>x.id===i),un=$('#mu2'),v0=+$('#ma').value,v=un&&s.k&&un.value===s.u2?v0/s.k:v0;if(v>0){s.q=+((+s.q)+v).toFixed(3);ml=null;save()}}
else if(a==='mdel'){if(conf!=='mdel')conf='mdel';else{conf=null;S.stock=S.stock.filter(x=>x.id!==ms.id);ms=newMs();save()}}
else if(a==='msv'){const n=ms.n.trim();
if(!n||(ms.q===''&&!ms.id))mmsg='Scrivi il nome e la quantità.';
else if(S.stock.some(x=>x.id!==ms.id&&x.n.trim().toLowerCase()===n.toLowerCase()))mmsg='Questo prodotto c’è già nel magazzino.';
else{const o={id:ms.id||uid(),n,q:+ms.q||0,u:ms.u,o:(ms.o||'').trim(),m:ms.m===''||ms.m==null?'':+ms.m,k:+ms.k>0?+ms.k:'',u2:+ms.k>0?ms.u2:''};if(ms.id)S.stock=S.stock.map(x=>x.id===ms.id?o:x);else S.stock.push(o);ms=newMs();mmsg='';save()}}
else if(a==='stop'){const o=open(i);o.e=Date.now();toast('Settore spento.',{k:'stop',id:o.id});save()}
else if(a==='undo'&&undo){const u=undo,l=S.logs.find(x=>x.id===u.id);if(l){if(u.k==='stop'){const z=S.zones.find(z=>z.sectors.some(s=>s.id===l.s));if(!z.sectors.some(s=>open(s.id)))l.e=null}else{adj(l.p,1);S.logs=S.logs.filter(x=>x.id!==u.id);(u.cl||[]).forEach(o=>o.e=null)}}undo=null;$('#tt').hidden=true;save()}
else if(a==='delz'||a==='dels'){const k=a+i;if(conf!==k)conf=k;else{conf=null;
if(a==='delz'){const z=S.zones.find(z=>z.id===i),ids=z.sectors.map(s=>s.id);S.logs=S.logs.filter(l=>!ids.includes(l.s));S.zones=S.zones.filter(z=>z.id!==i)}
else{S.zones.forEach(z=>z.sectors=z.sectors.filter(s=>s.id!==i));S.logs=S.logs.filter(l=>l.s!==i)}save()}}
else if(a==='day')sel=new Date(+i);
else if(a==='mon')cal=new Date(cal.getFullYear(),cal.getMonth()+ +i,1);
else if(a==='exp'){io=JSON.stringify(S);msg='Backup pronto: copia tutto il testo qui sopra.'}
else if(a==='imp'){try{const d=JSON.parse($('#io').value);if(!Array.isArray(d.zones)||!Array.isArray(d.logs))throw 0;S=Object.assign({zones:[],logs:[],alertDays:7,stock:[]},d);save();io='';msg='Dati importati.'}catch(x){io=$('#io').value;msg='Backup non valido: incolla il testo completo.'}}
draw()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,a=f.dataset.a,v=f.querySelector('input').value.trim();if(!v)return;
if(a==='addz')S.zones.push({id:uid(),name:v,color:f.querySelector('[type=color]').value,sectors:[]});
else S.zones.find(z=>z.id===f.dataset.i).sectors.push({id:uid(),name:v});
save();draw()});
function setf(t){const f=t.dataset.f;if(!f)return;const o=t.dataset.c==='d'?dr:t.dataset.c==='m'?ms:ed;if(!o)return;if(t.dataset.k!==undefined)o.p[+t.dataset.k][f]=t.value;else o[f]=t.value}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='hs'){hs=t.value;draw();return}
if(t.id==='ad'){S.alertDays=Math.max(1,+t.value||7);save()}
setf(t);if(t.dataset.f==='u'||t.dataset.f==='t'){if(t.dataset.f==='t'&&ed.t!=='acqua'&&!ed.p.length)ed.p.push(blank());draw()}});
document.addEventListener('input',e=>{if(e.target.id==='io')io=e.target.value;setf(e.target)});
setInterval(()=>document.querySelectorAll('[data-b]').forEach(x=>x.textContent=dur(Date.now()-x.dataset.b)),30000);
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
